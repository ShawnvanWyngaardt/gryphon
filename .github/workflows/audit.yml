# Full dependency audit, dev tools included (decided in PR 25).
# Not a required check: a new advisory in a test tool must be seen and
# handled, but must not block unrelated pull requests. Runtime
# dependencies are still audited on every PR by ci.yml.
name: Audit

on:
  schedule:
    # Mondays 06:17 UTC.
    - cron: '17 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Full npm audit (dev included)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Accepted dev-only advisories are listed in docs/SPEC.md section 8.2.
      # This job stays red until each one is fixed upstream and updated.
      - run: npm audit --audit-level=high
